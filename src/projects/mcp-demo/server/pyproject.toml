[project]
name = "mcp-demo-server"
version = "0.1.0"
description = "MCP demo servers (weather, docs, sql) + JWT auth server"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5",
    "httpx>=0.28",
    "langchain-text-splitters>=1.1",
    "mcp>=2.2",
    "pyjwt[crypto]>=2.10",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
