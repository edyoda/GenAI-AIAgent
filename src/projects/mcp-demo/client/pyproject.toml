requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.19",
    "httpx>=0.28",
    "langchain>=1.4.2",
    "langchain-groq>=1.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6",
    "langsmith>=0.14",
    "mcp>=1.24,<2",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
