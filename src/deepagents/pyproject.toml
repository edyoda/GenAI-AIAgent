[project]
name = "deepagents-demo"
version = "0.1.0"
description = "Standalone LangChain deep agent: built-in planning/files/subagents + weather, Tavily web search and calculator tools"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.19",
    "langchain>=1.4.2",
    "langchain-groq>=1.1",
    "langchain-openai>=1.6",
    "langchain-tavily>=0.2",
    "langsmith>=0.14",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
